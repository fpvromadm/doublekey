name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./build.sh test
      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist
      - name: Build
        run: ./build.sh
      - name: Package
        run: ditto -c -k --keepParent build/DoubleKey.app DoubleKey.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DoubleKey.zip --title "DoubleKey $GITHUB_REF_NAME" --generate-notes
